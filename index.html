<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Primary Meta Tags -->
    <title>UniLife Ethiopia — Complete Student Life Organizer Platform</title>
    <meta name="title" content="UniLife Ethiopia — Complete Student Life Organizer Platform" />
    <meta name="description" content="Study smarter. Stay organized. Achieve more. 100% Free academic tools for university and college students in Ethiopia." />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#172554" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="UniLife" />
    
    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-brand-bg text-brand-text font-sans antialiased min-h-screen selection:bg-brand-lightBlue selection:text-brand-blue">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service worker registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('✅ UniLife Ethiopia Service Worker registered with scope:', reg.scope))
            .catch(err => console.log('SW registration error:', err));
        });
      }
    </script>
  </body>
</html>
